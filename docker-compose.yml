# The version property is now optional in modern Docker Compose
# version: '3.8'

name: wwebjs-api

services:
  api:
    build: .
    container_name: wwebjs-api
    restart: always
    # Hard memory cap: this service spawns a headless Chromium per WhatsApp
    # session and can balloon unbounded. Without a limit it once thrashed the
    # host into a swap-livelock hang (Jul 1 2026). Capping it means Docker
    # OOM-kills + restarts only THIS container instead of freezing the box.
    # earlyoom is the second line of defence. Raise if you see nuisance
    # restarts under normal session load.
    #
    # ADDED 2026-08-21 (@Admin) -- this comment described the cap for weeks
    # but no mem_limit/memswap_limit was actually present in this file
    # (confirmed via `docker inspect`: Memory=0, no limit). Found after a real
    # kernel OOM kill at 04:53:49Z today (~24GB anon-rss from one Chromium
    # process, box has 31GB total) went undetected -- restarts=0, so nothing
    # alerted; only visible in dmesg. earlyoom was also never installed
    # (`systemctl is-active earlyoom` -> inactive, unit not found), so BOTH
    # documented lines of defence were missing. 5 active WhatsApp sessions
    # currently use 2.4GB combined, so 8GB is generous headroom above normal
    # load while stopping a repeat of the July hang or tonight's OOM.
    # memswap_limit == mem_limit disables extra swap for this container
    # specifically, which is what directly prevents the swap-livelock failure
    # mode the original comment names -- a capped process gets OOM-killed
    # cleanly and fast instead of thrashing the host into swap.
    mem_limit: 8g
    memswap_limit: 8g
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    volumes:
      # Use a named Docker volume so WhatsApp sessions persist across
      # container recreations / redeploys (e.g. on Dokploy). The data lives
      # in Docker-managed storage, NOT inside the repository directory, so a
      # fresh deploy no longer resets the session.
      - wwebjs_sessions:/usr/src/app/sessions
    # Optional: route Chromium (WhatsApp Web) traffic through an outbound proxy.
    # Set PROXY_URL (and optionally PROXY_USERNAME / PROXY_PASSWORD for HTTP
    # Basic auth) in .env, or uncomment the block below to point at the
    # bundled tinyproxy service.
    # environment:
    #   PROXY_URL: http://tinyproxy:8888
    #   # PROXY_USERNAME: api-key
    #   # PROXY_PASSWORD: your-api-key
    # depends_on:
    #   - tinyproxy
    # Optional healthcheck
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # Optional: local HTTP proxy for testing the PROXY_URL feature end-to-end.
  # Uncomment along with the api `environment` / `depends_on` blocks above.
  # tinyproxy:
  #   image: vimagick/tinyproxy
  #   container_name: wwebjs-tinyproxy
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     ALLOWED_NETWORKS: 0.0.0.0/0
  #     # Uncomment to test the PROXY_USERNAME / PROXY_PASSWORD path.
  #     # BASIC_AUTH_USER: "api-key"
  #     # BASIC_AUTH_PASSWORD: "your-api-key"
  #   restart: unless-stopped

# Named volumes managed by Docker. Persists independently of the container
# and the repository working directory, so sessions survive redeploys.
volumes:
  wwebjs_sessions:
